<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-ecomonitor-original.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EcoMonitor: monitoramento de queimadas e desmatamento."
    />
    <title>EcoMonitor | Monitoramento ambiental</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint (evita flash de tema
      // errado). Padrão: claro. Sincroniza data-theme + classe .dark
      // (Tailwind/shadcn) para o CSS pegar o tema desde o início.
      ;(function () {
        var tema = 'claro'
        try {
          if (localStorage.getItem('ecomonitor.tema') === 'escuro') {
            tema = 'escuro'
          }
        } catch (e) {
          /* localStorage indisponível: fica no padrão claro */
        }
        var raiz = document.documentElement
        raiz.setAttribute('data-theme', tema)
        raiz.classList.toggle('dark', tema === 'escuro')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
